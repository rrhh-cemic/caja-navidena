<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrega Caja Navideña</title>
<style>
  :root {
    --pino: #0E3B2C;
    --pino-claro: #1F5C46;
    --fondo: #EEF3F0;
    --tinta: #12211B;
    --gris: #5B6B64;
    --ok: #0F6B45;
    --ya: #A3221E;
    --aviso: #8A5A00;
    --blanco: #FFFFFF;
    --stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--stack);
    background: var(--fondo);
    color: var(--tinta);
    -webkit-font-smoothing: antialiased;
  }
  .vista { display: none; min-height: 100%; }
  .vista.activa { display: flex; }

  /* ── Formulario ── */
  #vForm {
    flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) 24px 32px;
    max-width: 480px; margin: 0 auto;
  }
  .marca { color: var(--pino-claro); font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 28px; color: var(--pino); letter-spacing: -0.01em; }
  label { display: block; font-size: 17px; font-weight: 600; margin-bottom: 10px; }
  .ayuda { font-size: 15px; color: var(--gris); margin: 10px 0 0; line-height: 1.4; }
  input {
    width: 100%; font: inherit; font-size: 28px; font-weight: 600;
    letter-spacing: 0.04em; padding: 16px 18px;
    border: 2px solid #C5D3CC; border-radius: 12px; background: var(--blanco); color: var(--tinta);
    font-variant-numeric: tabular-nums;
  }
  input:focus { outline: none; border-color: var(--pino); box-shadow: 0 0 0 4px rgba(14,59,44,.15); }
  button {
    font: inherit; font-size: 19px; font-weight: 700; width: 100%;
    margin-top: 22px; padding: 18px; border: 0; border-radius: 12px;
    background: var(--pino); color: var(--blanco); cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #E9B949; outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: wait; }
  .error { color: var(--ya); font-size: 16px; font-weight: 600; margin: 14px 0 0; min-height: 1.4em; }
  .punto { margin-top: auto; padding-top: 32px; font-size: 14px; color: var(--gris); }

  /* ── Resultado (pantalla completa, color según estado) ── */
  #vRes {
    flex-direction: column; color: var(--blanco);
    padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
  }
  #vRes.ok { background: var(--ok); }
  #vRes.ya { background: var(--ya); }
  #vRes.aviso { background: var(--aviso); }
  .estado { font-size: 22px; font-weight: 700; margin: 0 0 22px; }
  .nombre { font-size: 34px; line-height: 1.1; font-weight: 800; margin: 0 0 12px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .sector { font-size: 20px; line-height: 1.35; margin: 0; opacity: .92; }
  .registro { font-size: 18px; margin: 22px 0 0; line-height: 1.4; }
  .registro strong { font-variant-numeric: tabular-nums; }
  .mensaje { font-size: 20px; line-height: 1.4; margin: 0; }

  .reloj {
    margin-top: auto; padding-top: 28px;
    display: flex; align-items: center; gap: 16px;
  }
  .reloj .hora {
    font-size: clamp(56px, 19vw, 96px); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .reloj .fecha { font-size: 16px; opacity: .85; margin-top: 6px; }
  .latido {
    width: 18px; height: 18px; border-radius: 50%; background: var(--blanco); flex: none;
    animation: latido 1s ease-in-out infinite;
  }
  @keyframes latido { 0%,100% { transform: scale(.55); opacity: .45; } 50% { transform: scale(1); opacity: 1; } }

  .otra {
    background: transparent; color: var(--blanco); border: 2px solid rgba(255,255,255,.6);
    font-size: 16px; padding: 12px; margin-top: 24px;
  }
  @media (prefers-reduced-motion: reduce) { .latido { animation: none; } }
</style>
</head>
<body>

<section id="vForm" class="vista activa" aria-live="polite">
  <p class="marca">CEMIC Recursos Humanos</p>
  <h1 id="titulo"></h1>

  <div id="bloqueForm">
    <label for="dato">Tu DNI o número de legajo</label>
    <input id="dato" inputmode="numeric" autocomplete="off" enterkeyhint="go" maxlength="20">
    <p class="ayuda">Al confirmar, mostrale la pantalla a quien entrega las cajas.</p>
    <button id="btn" type="button">Registrar retiro</button>
    <p id="error" class="error" role="alert"></p>
  </div>

  <p id="punto" class="punto"></p>
</section>

<section id="vRes" class="vista" aria-live="assertive">
  <p id="rEstado" class="estado"></p>
  <div id="rCuerpo"></div>
  <div class="reloj" aria-hidden="true">
    <span class="latido"></span>
    <div>
      <div id="relojHora" class="hora">--:--:--</div>
      <div id="relojFecha" class="fecha"></div>
    </div>
  </div>
  <button id="btnOtra" class="otra" type="button">Volver</button>
</section>

<script>
  /* ===== Configuración ===== */
  const API_URL = 'https://script.google.com/macros/s/AKfycbwOS8q3Wa95BfmUeNptfeZuF-X2g7I1Y3JiIN1tnZsBGQRQq4TLBEvlSOCIw0IZjjksyg/exec';
  const TZ = 'America/Argentina/Buenos_Aires';

  const params = new URLSearchParams(location.search);
  const DEMO = params.has('demo');
  const PUNTO = (params.get('punto') || '').trim().slice(0, 60);
  let offsetMs = 0;

  /* ===== Comunicación con Apps Script ===== */
  async function api(payload) {
    if (DEMO) return mock(payload);
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow',
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(t);
    }
  }

  /* ===== Modo demo (?demo): datos de prueba, no toca la planilla ===== */
  const DEMO_PADRON = [
    { legajo:'1001', dni:'30111222', nombre:'María Laura Gómez', area:'Enfermería', departamento:'Internación Pediátrica', sede:'Saavedra' },
    { legajo:'1002', dni:'28999888', nombre:'Juan Pablo Ferreyra', area:'Administración', departamento:'Facturación', sede:'Pombo' }
  ];
  const demoEntregas = { '28999888': Date.now() - 7 * 60000 };
  function demoPartes(ms) {
    const f = (o) => new Intl.DateTimeFormat('es-AR', Object.assign({ timeZone: TZ }, o)).format(new Date(ms));
    return { fecha: f({ day:'2-digit', month:'2-digit', year:'numeric' }), hora: f({ hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }), registroMs: ms };
  }
  function mock(payload) {
    return new Promise(res => setTimeout(() => {
      const now = Date.now();
      if (payload.accion !== 'registrar') return res({ estado:'CONFIG', titulo:'Entrega Caja Navideña 2026 (demo)', activo:true, serverMs: now });
      const d = String(payload.dato).replace(/\D/g, '');
      const p = DEMO_PADRON.find(x => x.dni === d || x.legajo === d);
      if (!p) return res({ estado:'NO_ENCONTRADO', mensaje:'No encontramos ese DNI o legajo en el padrón. Acercate a RRHH.', serverMs: now });
      if (demoEntregas[p.dni]) return res(Object.assign({ estado:'YA_ENTREGADO', persona:p, serverMs: now }, demoPartes(demoEntregas[p.dni])));
      demoEntregas[p.dni] = now;
      res(Object.assign({ estado:'OK', persona:p, serverMs: now }, demoPartes(now)));
    }, 600));
  }

  /* ===== Interfaz ===== */
  const $ = id => document.getElementById(id);
  const fmtHora = new Intl.DateTimeFormat('es-AR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const fmtFecha = new Intl.DateTimeFormat('es-AR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });

  function tic() {
    const ahora = new Date(Date.now() + offsetMs);
    $('relojHora').textContent = fmtHora.format(ahora);
    $('relojFecha').textContent = fmtFecha.format(ahora);
  }
  setInterval(tic, 250); tic();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function mostrar(vista) {
    $('vForm').classList.toggle('activa', vista === 'form');
    $('vRes').classList.toggle('activa', vista === 'res');
    window.scrollTo(0, 0);
  }

  function sector(p) {
    const partes = [p.departamento, p.area].filter(Boolean);
    if (partes.length === 2 && partes[0].toLowerCase() === partes[1].toLowerCase()) partes.pop();
    return partes.map(esc).join('<br>');
  }

  function haceCuanto(ms) {
    const min = Math.floor(ms / 60000);
    if (min < 1) return 'hace menos de un minuto';
    if (min === 1) return 'hace 1 minuto';
    if (min < 60) return 'hace ' + min + ' minutos';
    const h = Math.floor(min / 60);
    return h === 1 ? 'hace 1 hora' : 'hace ' + h + ' horas';
  }

  function render(r) {
    if (typeof r.serverMs === 'number') offsetMs = r.serverMs - Date.now();
    const v = $('vRes');
    v.className = 'vista';

    if (r.estado === 'ERROR') {
      $('error').textContent = r.mensaje;
      mostrar('form');
      return;
    }

    if (r.estado === 'OK') {
      v.classList.add('ok');
      $('rEstado').textContent = 'Caja entregada';
      $('rCuerpo').innerHTML =
        '<p class="nombre">' + esc(r.persona.nombre) + '</p>' +
        '<p class="sector">' + sector(r.persona) + '</p>' +
        '<p class="registro">Registrado el <strong>' + esc(r.fecha) + '</strong> a las <strong>' + esc(r.hora) + '</strong></p>';
      $('btnOtra').hidden = true;
    } else if (r.estado === 'YA_ENTREGADO') {
      v.classList.add('ya');
      $('rEstado').textContent = 'Esta caja ya fue retirada';
      $('rCuerpo').innerHTML =
        '<p class="nombre">' + esc(r.persona.nombre) + '</p>' +
        '<p class="sector">' + sector(r.persona) + '</p>' +
        '<p class="registro">Retiro registrado el <strong>' + esc(r.fecha) + '</strong> a las <strong>' + esc(r.hora) + '</strong><br>(' +
        haceCuanto(r.serverMs - r.registroMs) + ')</p>';
      $('btnOtra').hidden = false;
    } else {
      v.classList.add('aviso');
      $('rEstado').textContent = r.estado === 'INACTIVO' ? 'Registro cerrado' : 'No encontrado';
      $('rCuerpo').innerHTML = '<p class="mensaje">' + esc(r.mensaje) + '</p>';
      $('btnOtra').hidden = r.estado === 'INACTIVO';
    }
    v.classList.add('activa');
    mostrar('res');
  }

  async function enviar() {
    const dato = $('dato').value.trim();
    $('error').textContent = '';
    if (!dato) { $('error').textContent = 'Ingresá tu DNI o tu número de legajo.'; $('dato').focus(); return; }

    const btn = $('btn');
    btn.disabled = true; btn.textContent = 'Registrando…';
    try {
      render(await api({ accion: 'registrar', dato: dato, punto: PUNTO }));
    } catch (err) {
      $('error').textContent = 'No se pudo conectar. Revisá la señal y probá de nuevo.';
    } finally {
      btn.disabled = false; btn.textContent = 'Registrar retiro';
    }
  }

  $('titulo').textContent = 'Entrega Caja Navideña';
  $('punto').textContent = PUNTO ? 'Punto de entrega: ' + PUNTO : '';
  $('btn').addEventListener('click', enviar);
  $('dato').addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
  $('btnOtra').addEventListener('click', () => { $('dato').value = ''; mostrar('form'); $('dato').focus(); });

  api({ accion: 'config' }).then(c => {
    if (typeof c.serverMs === 'number') offsetMs = c.serverMs - Date.now();
    if (c.titulo) { $('titulo').textContent = c.titulo; document.title = c.titulo; }
    if (c.activo === false) render({ estado: 'INACTIVO', mensaje: c.msjInactivo });
  }).catch(() => { /* si falla, el formulario igual queda disponible */ });
</script>
</body>
</html>
